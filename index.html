<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b211b">
  <title>NO MERCY — কার্ড নাইট</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game-shell">
    <header class="topbar">
      <a class="brand" href="#" aria-label="No Mercy home"><span class="brand-mark">UNO</span><span class="brand-copy"><b>NO MERCY</b><small>কার্ড নাইট</small></span></a>
      <div class="top-actions"><span class="round-pill"><i></i> লোকাল গেম</span><button class="icon-button" id="rulesBtn" aria-label="নিয়ম দেখুন">?</button><button class="icon-button" id="soundBtn" aria-label="সাউন্ড টগল">♫</button></div>
    </header>

    <section class="table-wrap" aria-label="গেম টেবিল">
      <div class="table-rim"><div class="table-felt">
        <div class="table-texture"></div>
        <div class="table-logo"><span class="logo-uno">UNO</span><span>NO MERCY</span><small>SHOW ’EM WHAT YOU’VE GOT</small></div>
        <div class="opponent opponent-top" id="opp-1"></div>
        <div class="opponent opponent-left" id="opp-2"></div>
        <div class="opponent opponent-right" id="opp-3"></div>
        <div class="turn-indicator" id="turnIndicator"><span class="turn-dot"></span><span id="turnText">তোমার পালা</span><span class="direction">↻</span></div>
        <div class="center-play">
          <div class="deck-zone"><span class="zone-label">ড্র পাইল</span><button class="card back-card deck-card" id="drawPile" aria-label="কার্ড তুলুন"><span class="back-ring">UNO<small>NO MERCY</small></span></button><span class="deck-count" id="deckCount">১০০</span></div>
          <div class="discard-zone"><span class="zone-label">ডিসকার্ড</span><div class="discard-stack" id="discardStack"></div></div>
          <div class="challenge-toast" id="challengeToast" hidden></div>
        </div>
        <div class="player-seat"><div class="player-badge"><span class="avatar you-avatar">তুমি</span><span class="player-meta"><b>তুমি</b><small id="playerCardCount">৭টি কার্ড</small></span><span class="you-turn" id="youTurn">তোমার পালা</span></div></div>
        <div class="table-ornament ornament-a"></div><div class="table-ornament ornament-b"></div>
      </div></div>
    </section>

    <section class="controls-row">
      <div class="status-copy"><span class="eyebrow">চাল চলছে</span><strong id="statusText">একটি কার্ড বেছে নাও</strong><small id="subStatus">রং, সংখ্যা বা চিহ্ন মিলিয়ে খেলো</small></div>
      <div class="control-buttons"><button class="secondary-button" id="sortBtn">⇅ <span>গোছাও</span></button><button class="draw-button" id="drawBtn"><span class="draw-icon">＋</span><span id="drawButtonText">কার্ড তুলো</span></button><button class="uno-button" id="unoBtn">UNO!</button></div>
    </section>

    <section class="hand-panel"><div class="hand-heading"><span>তোমার হাত <b id="handCount">৭</b></span><span class="hand-hint" id="handHint">কার্ডে চাপ দিয়ে খেলো</span></div><div class="hand-scroll" id="playerHand" aria-label="তোমার কার্ড"></div></section>
    <footer class="footer-note"><span>একজন খেলোয়াড় · ৩ জন প্রতিদ্বন্দ্বী</span><span><b>২৫+</b> কার্ড হলে বাদ</span><button id="newGameBtn">নতুন গেম ↻</button></footer>
  </main>

  <div class="overlay" id="modal" hidden><div class="modal-card" role="dialog" aria-modal="true"><button class="modal-close" id="modalClose" aria-label="বন্ধ করুন">×</button><div id="modalContent"></div></div></div>
  <div class="live-message" id="liveMessage" aria-live="polite"></div>
  <script src="game.js"></script>
</body>
</html>
