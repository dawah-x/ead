<style>
:root{color-scheme:dark;--gold:#f5b81c;--gold2:#ffd56a;--text:#eef2f8;--muted:#a7b3c7}
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100dvh;display:grid;place-items:center;padding:calc(28px + env(safe-area-inset-top)) 20px calc(28px + env(safe-area-inset-bottom));background:radial-gradient(ellipse at 50% 0,rgba(245,184,28,.1),transparent 55%),#08151a;color:var(--text);font-family:"Hind Siliguri",system-ui,sans-serif;line-height:1.65}

h1{margin:14px 0 6px;font-size:26px;line-height:1.3;color:#fff}
p{color:var(--muted);font-size:14.5px;margin-bottom:20px}
.links{display:grid;gap:9px;margin-top:22px}
a{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:50px;padding:12px 16px;border:1px solid rgba(173,193,215,.16);border-radius:14px;background:rgba(255,255,255,.03);color:var(--text);font-weight:600;text-decoration:none;transition:border-color .18s ease,background .18s ease}
a:hover,a:focus-visible{border-color:rgba(245,184,28,.55);background:rgba(245,184,28,.08)}
a span{color:var(--muted);font-weight:400;font-size:13px}
button{width:100%;min-height:48px;margin-top:12px;border:0;border-radius:14px;background:linear-gradient(135deg,#ffd651,#f0a800);color:#1a1300;font:inherit;font-weight:700;cursor:pointer}
button:focus-visible{outline:2px solid #ffe09a;outline-offset:2px}
.status{display:inline-flex;align-items:center;gap:8px;padding:5px 12px;border:1px solid rgba(255,120,120,.35);border-radius:999px;background:rgba(255,120,120,.07);color:#ffb3b3;font-size:11px;font-weight:700;letter-spacing:.6px}
</style>
